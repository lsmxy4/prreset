<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리의 작품, 한자리에 | 조별 전시회</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{font-family:'Noto Sans KR',sans-serif;color:#26352f;background:#f6f7f2}*{box-sizing:border-box}body{margin:0}button,a,input{font:inherit}header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dfe4da;padding:0 max(5vw,24px)}.brand{font-weight:800;letter-spacing:-1px}.brand span{display:inline-grid;place-items:center;background:#285944;color:white;width:31px;height:31px;border-radius:9px;margin-right:10px}.tag{font-size:12px;color:#67736b}main{max-width:1180px;margin:auto;padding:55px 26px 30px}.eyebrow{font-size:12px;color:#42674f;letter-spacing:2px;font-weight:700}h1{font-size:clamp(32px,4vw,48px);letter-spacing:-2px;margin:14px 0}p{line-height:1.8;color:#778077}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.note{background:#e9eee2;padding:17px 22px;border-radius:12px;font-size:12px;line-height:1.8;color:#56664d}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h2{font-size:18px;margin:0}h2 span{font-size:12px;color:#788474;margin-left:10px}input{border:1px solid #dce1d6;border-radius:8px;background:white;padding:11px 15px;width:240px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:#fff;border:1px solid #dfe4d9;border-radius:16px;overflow:hidden}.visual{height:165px;background:var(--bg);padding:22px;position:relative;display:flex;align-items:center;justify-content:center}.number{position:absolute;top:17px;left:18px;font-size:11px;font-weight:700;background:#ffffffa6;padding:5px 9px;border-radius:5px}.shape{font-size:70px;color:var(--ink);line-height:1;letter-spacing:-18px;transform:rotate(-12deg);user-select:none}.body{padding:22px}.category{font-size:10px;letter-spacing:1px;color:#84917c}h3{font-size:20px;letter-spacing:-.7px;margin:8px 0}.desc{font-size:12px;min-height:44px;margin:0 0 20px}.buttons{display:flex;gap:8px}button{cursor:pointer;border:0;border-radius:7px;padding:12px 10px;font-size:12px;font-weight:600}.ppt{background:#285944;color:white;flex:1}.link{background:#f0f3ec;color:#3d5548;flex:1}button:hover{filter:brightness(.94)}button:focus-visible,a:focus-visible{outline:3px solid #d29d38;outline-offset:3px}footer{margin-top:40px;border-top:1px solid #e0e5d9;padding:20px 0;display:flex;justify-content:space-between;font-size:11px;color:#859080}dialog{border:0;border-radius:18px;padding:28px;max-width:620px;width:calc(100% - 36px);box-shadow:0 20px 80px #19392f30}dialog::backdrop{background:#162e2566;backdrop-filter:blur(4px)}.modal-top{display:flex;justify-content:space-between;align-items:center}.close{background:#edf0e9}.slide{background:#eaf0e3;padding:45px 28px;margin:22px 0;border-radius:12px;min-height:230px}.slide h3{font-size:28px}.slide p{font-size:14px}.pager{display:flex;align-items:center;justify-content:space-between}.pager button{background:#285944;color:white}.placeholder{background:#f2f4ef;padding:20px;border-radius:9px;margin:22px 0;color:#67745f;font-size:14px}.empty{grid-column:1/-1;padding:40px;text-align:center;color:#7b8475}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.note{display:none}}@media(max-width:580px){header{height:66px}.tag{display:none}main{padding-top:35px}.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;gap:16px;flex-direction:column}input{width:100%}.intro{margin-bottom:30px}footer{gap:12px;flex-direction:column}}
</style></head><body>
<header><div class="brand"><span>▦</span>우리의 전시회</div><div class="tag">TEAM PROJECT EXHIBITION · 기본 틀</div></header>
<main><section class="intro"><div><div class="eyebrow">IDEAS COME TOGETHER</div><h1>우리의 작품, 한자리에.</h1><p>각 조의 아이디어와 결과물을 만나보세요.<br>설명 자료부터 프로젝트 링크까지, 한눈에 살펴볼 수 있어요.</p></div><div class="note">👋 전시회 관람 안내<br>관심 있는 작품의 버튼을 눌러<br>설명 자료와 관련 링크를 확인하세요.</div></section>
<section><div class="toolbar"><h2>조별 작품 <span id="count"></span></h2><input id="search" type="search" placeholder="조 이름 또는 작품 검색" aria-label="조 이름 또는 작품 검색"></div><div class="grid" id="grid"></div></section>
<footer><span>우리의 전시회 · 함께 만든 아이디어를 공유하는 공간</span><span>현재 작품과 자료는 예시입니다.</span></footer></main>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><h2 id="modal-title"></h2><button class="close" aria-label="닫기">✕</button></div><div id="modal-content"></div></dialog>
<script>
// 실제 자료를 넣을 때 title, description, pptUrl, projectUrl을 변경하세요.
// pptUrl에는 PPT 파일 또는 Google Slides / PDF 공유 주소를 넣을 수 있습니다.
const teams = [
 {name:'1조',title:'스마트 캠퍼스',category:'생활 · 편의',description:'더 편리한 학교생활을 위한 아이디어를 소개합니다.',bg:'#e6eddb',ink:'#658754',shape:'▥',pptUrl:'',projectUrl:''},
 {name:'2조',title:'우리 동네 이야기',category:'지역 · 연결',description:'지역의 숨은 이야기를 발견하고 함께 공유합니다.',bg:'#ece7dd',ink:'#a58762',shape:'◒',pptUrl:'',projectUrl:''},
 {name:'3조',title:'작은 친환경 실천',category:'환경 · 지속가능성',description:'일상 속 작은 행동으로 만드는 변화를 담았습니다.',bg:'#e0eae8',ink:'#59857e',shape:'✳',pptUrl:'',projectUrl:''},
 {name:'4조',title:'함께하는 배움',category:'교육 · 협력',description:'서로의 지식을 나누는 새로운 학습 경험을 제안합니다.',bg:'#e9e5ef',ink:'#8e78a4',shape:'▧',pptUrl:'',projectUrl:''},
 {name:'5조',title:'일상의 기록',category:'문화 · 기록',description:'평범한 순간을 특별하게 남기는 프로젝트입니다.',bg:'#f0e5df',ink:'#b08772',shape:'◉',pptUrl:'',projectUrl:''},
 {name:'6조',title:'새로운 연결',category:'소통 · 커뮤니티',description:'사람과 사람 사이를 이어 주는 방법을 고민합니다.',bg:'#e4e9f0',ink:'#7589a9',shape:'⌘',pptUrl:'',projectUrl:''}
];
const grid=document.querySelector('#grid'),modal=document.querySelector('#modal'),content=document.querySelector('#modal-content');
function render(query=''){const filtered=teams.map((t,i)=>({...t,i})).filter(t=>(t.name+t.title+t.description).includes(query));document.querySelector('#count').textContent=filtered.length+'개 작품';grid.innerHTML=filtered.map(t=>`<article class="card"><div class="visual" style="--bg:${t.bg};--ink:${t.ink}"><span class="number">${t.name} PROJECT</span><div class="shape" aria-hidden="true">${t.shape}</div></div><div class="body"><div class="category">${t.category}</div><h3>${t.title}</h3><p class="desc">${t.description}</p><div class="buttons"><button class="ppt" data-team="${t.i}" data-action="ppt">▤ 설명 PPT 보기</button><button class="link" data-team="${t.i}" data-action="link">↗ 관련 링크</button></div></div></article>`).join('')||'<div class="empty">검색한 작품이 없습니다.</div>'}
let page=0,current;
function slides(){const texts=[['프로젝트 소개',current.description],['아이디어와 제작 과정','이 페이지에 작품의 목적, 주요 기능, 제작 과정을 넣어 주세요.'],['결과물과 기대 효과','작품 사진과 완성된 결과, 기대 효과를 소개해 주세요.']];content.innerHTML=`<div class="slide"><div class="eyebrow">${current.name} · 예시 설명 자료</div><h3>${texts[page][0]}</h3><p>${texts[page][1]}</p></div><div class="pager"><button id="prev" ${page===0?'disabled':''}>← 이전</button><span>${page+1} / 3</span><button id="next" ${page===2?'disabled':''}>다음 →</button></div><p style="font-size:11px">실제 PPT 연결 전 보여주는 예시입니다.</p>`;document.querySelector('#prev').onclick=()=>{if(page>0){page--;slides()}};document.querySelector('#next').onclick=()=>{if(page<2){page++;slides()}}}
grid.onclick=e=>{const button=e.target.closest('button');if(!button)return;current=teams[Number(button.dataset.team)];const url=button.dataset.action==='ppt'?current.pptUrl:current.projectUrl;if(url){if(/^https?:\/\//i.test(url)||/^[./]/.test(url)){window.open(url,'_blank','noopener,noreferrer')}return}document.querySelector('#modal-title').textContent=current.name+' · '+current.title;if(button.dataset.action==='ppt'){page=0;slides()}else{content.innerHTML='<div class="placeholder">아직 관련 링크가 등록되지 않았어요.<br>나중에 이 조의 웹사이트, 영상 또는 결과물 링크를 연결할 수 있습니다.</div>'}modal.showModal()};
document.querySelector('.close').onclick=()=>modal.close();modal.onclick=e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}};document.querySelector('#search').oninput=e=>render(e.target.value.trim());render();
</script></body></html>
